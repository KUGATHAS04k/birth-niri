<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday!</title>
<style>
  :root {
    --bg1: #ff9a9e;
    --bg2: #fad0c4;
    --bg3: #a18cd1;
    --ink: #3b2a50;
    --card: rgba(255,255,255,.82);
    --accent: #ff4f81;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: linear-gradient(135deg, var(--bg1), var(--bg2) 45%, var(--bg3));
    background-size: 200% 200%;
    animation: drift 12s ease infinite;
    overflow-x: hidden;
  }
  @keyframes drift { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

  canvas#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }

  main {
    min-height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: max(20px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
    text-align: center; gap: 18px;
  }
  .cake { font-size: clamp(72px, 22vw, 120px); animation: bounce 2s ease-in-out infinite; user-select: none; cursor: pointer; }
  @keyframes bounce { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-14px) rotate(3deg); } }

  h1 { font-size: clamp(2rem, 9vw, 3.6rem); line-height: 1.1; text-shadow: 0 2px 0 rgba(255,255,255,.6); }
  h1 span { display: inline-block; color: var(--accent); animation: pop .8s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes pop { from { transform: scale(0) rotate(-20deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }

  .sub { font-size: clamp(1rem, 4.2vw, 1.25rem); opacity: .85; max-width: 32rem; }

  button {
    font: inherit; font-weight: 700; font-size: 1.05rem;
    padding: 14px 28px; border: 0; border-radius: 999px; cursor: pointer;
    color: #fff; background: var(--accent);
    box-shadow: 0 8px 20px rgba(255,79,129,.45);
    transition: transform .15s, box-shadow .15s;
  }
  button:active { transform: scale(.95); box-shadow: 0 4px 10px rgba(255,79,129,.4); }

  .wishes { width: 100%; max-width: 30rem; display: grid; gap: 12px; }
  .wish {
    background: var(--card); backdrop-filter: blur(6px);
    border-radius: 18px; padding: 16px 18px; font-size: 1.05rem; line-height: 1.45;
    box-shadow: 0 6px 18px rgba(59,42,80,.15);
    opacity: 0; transform: translateY(20px);
    transition: opacity .6s ease, transform .6s ease;
  }
  .wish.show { opacity: 1; transform: none; }
  .hidden { display: none; }

  .gallery { width: 100%; max-width: 30rem; }
  .track {
    display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory;
    padding: 10px 4px 18px; -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .track::-webkit-scrollbar { display: none; }
  .polaroid {
    flex: 0 0 82%; scroll-snap-align: center; background: #fff;
    padding: 10px 10px 14px; border-radius: 6px;
    box-shadow: 0 10px 24px rgba(59,42,80,.25);
    transform: rotate(var(--tilt, -2deg));
  }
  .polaroid:nth-child(even) { --tilt: 2deg; }
  .polaroid img { width: 100%; aspect-ratio: 4/5; object-fit: cover; display: block; border-radius: 3px; background: #eee; }
  .hint { font-size: .85rem; opacity: .7; margin-top: -6px; }
  footer { font-size: .85rem; opacity: .7; }

  @media (prefers-reduced-motion: reduce) {
    body, .cake, h1 span { animation: none; }
  }
</style>
</head>
<body>
<canvas id="confetti"></canvas>

<main>
  <div class="cake" id="cake" title="Tap me!">🎂</div>
  <h1 id="title">Happy Birthday!</h1>
  <p class="sub" id="sub">Today is all about you. Tap the button for a little surprise.</p>
  <button id="btn">Open your wishes 🎁</button>

  <section class="wishes hidden" id="wishes" aria-live="polite"></section>
  <section class="gallery hidden" id="gallery">
    <div class="track" id="track"></div>
    <p class="hint">Swipe through the memories 💕</p>
  </section>
  <footer id="from"></footer>
</main>

<script>
/* ===== EDIT THESE ===== */
const CONFIG = {
  name: "Friend",            // or open the page with ?name=Sam&from=Alex
  from: "",                  // your name (optional)
  // Put her photos in the same folder as this file, then list the file names:
  photos: [
    // "photo1.jpg",
    // "photo2.jpg",
    // "photo3.jpg"
  ],
  wishes: [
    "Wishing you a day filled with laughter, love and cake. 🍰",
    "May this year bring you new adventures and big wins. 🚀",
    "Thank you for being you. The world is better with you in it. 💛",
    "Make a wish, blow out the candles, and let it all come true! ✨"
  ]
};
/* ====================== */

const params = new URLSearchParams(location.search);
const name = (params.get("name") || CONFIG.name).slice(0, 40);
const from = (params.get("from") || CONFIG.from).slice(0, 40);

// Title with animated letters
const title = document.getElementById("title");
const text = name && name !== "Friend" ? `Happy Birthday, ${name}!` : "Happy Birthday!";
title.textContent = "";
[...text].forEach((ch, i) => {
  const s = document.createElement("span");
  s.textContent = ch === " " ? "\u00A0" : ch;
  s.style.animationDelay = (i * 45) + "ms";
  title.appendChild(s);
});
document.title = text;
if (from) document.getElementById("from").textContent = "With love, " + from + " ❤️";

/* ---------- Confetti ---------- */
const canvas = document.getElementById("confetti");
const ctx = canvas.getContext("2d");
let W, H, dpr;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener("resize", resize); resize();

const colors = ["#ff4f81", "#ffd23f", "#3bceac", "#5c7cfa", "#ff922b", "#b197fc", "#ffffff"];
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
let pieces = [], running = false;

function burst(x, y, count = 120, spread = Math.PI * 2, angle = -Math.PI / 2) {
  if (reduced) count = Math.floor(count / 4);
  for (let i = 0; i < count; i++) {
    const a = angle + (Math.random() - .5) * spread;
    const v = 4 + Math.random() * 9;
    pieces.push({
      x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
      w: 6 + Math.random() * 7, h: 4 + Math.random() * 6,
      rot: Math.random() * 6.28, vr: (Math.random() - .5) * .35,
      color: colors[(Math.random() * colors.length) | 0],
      shape: Math.random() < .25 ? "c" : "r",
      life: 0, max: 120 + Math.random() * 90
    });
  }
  if (!running) { running = true; requestAnimationFrame(tick); }
}

function tick() {
  ctx.clearRect(0, 0, W, H);
  pieces = pieces.filter(p => p.life < p.max && p.y < H + 30);
  for (const p of pieces) {
    p.life++;
    p.vx *= .985; p.vy = p.vy * .985 + .22;   // drag + gravity
    p.x += p.vx + Math.sin(p.life * .08) * .6;
    p.y += p.vy; p.rot += p.vr;
    ctx.save();
    ctx.globalAlpha = Math.min(1, (p.max - p.life) / 30);
    ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.fillStyle = p.color;
    if (p.shape === "c") { ctx.beginPath(); ctx.arc(0, 0, p.w / 2, 0, 6.28); ctx.fill(); }
    else ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    ctx.restore();
  }
  if (pieces.length) requestAnimationFrame(tick); else running = false;
}

function celebrate() {
  burst(W * .2, H * .85, 90, 1.2, -Math.PI / 2 - .5);
  burst(W * .8, H * .85, 90, 1.2, -Math.PI / 2 + .5);
  setTimeout(() => burst(W / 2, H * .35, 140), 250);
}

/* ---------- Interaction ---------- */
const wishesEl = document.getElementById("wishes");
const btn = document.getElementById("btn");
let opened = false;

btn.addEventListener("click", () => {
  celebrate();
  if (opened) return;
  opened = true;
  wishesEl.classList.remove("hidden");
  document.getElementById("sub").textContent = "Here are some wishes just for you:";
  btn.textContent = "More confetti! 🎉";
  CONFIG.wishes.forEach((w, i) => {
    const d = document.createElement("div");
    d.className = "wish"; d.textContent = w;
    wishesEl.appendChild(d);
    setTimeout(() => d.classList.add("show"), 300 + i * 500);
  });
  if (CONFIG.photos.length) {
    const track = document.getElementById("track");
    CONFIG.photos.forEach(src => {
      const f = document.createElement("figure");
      f.className = "polaroid";
      const img = document.createElement("img");
      img.src = src; img.alt = "Birthday memory"; img.loading = "lazy";
      f.appendChild(img); track.appendChild(f);
    });
    setTimeout(() => document.getElementById("gallery").classList.remove("hidden"),
      300 + CONFIG.wishes.length * 500);
  }
  setTimeout(() => btn.scrollIntoView({ behavior: "smooth", block: "end" }), 400);
});

document.getElementById("cake").addEventListener("click", e => {
  const r = e.currentTarget.getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2, 80);
});

// Tap anywhere else for a small burst
addEventListener("pointerdown", e => {
  if (e.target.closest("button, .cake")) return;
  burst(e.clientX, e.clientY, 50);
});

// Welcome burst
addEventListener("load", () => setTimeout(celebrate, 400));
</script>
</body>
</html>
